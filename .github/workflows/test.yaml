name: Run tests
on:
  push:
    branches:
      # Only mainline branches, features etc are covered on the pull_request trigger
      - '*.x'
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        php_version:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
        dependencies:
          - 'highest'
        koharness_modules:
          - 'all-modules'
          - 'core-only'
        include:
          - php_version: '8.0'
            dependencies: 'lowest'
            koharness_modules: 'all-modules'
          - php_version: '8.1'
            dependencies: 'lowest'
            koharness_modules: 'all-modules'
          - php_version: '8.2'
            dependencies: 'lowest'
            koharness_modules: 'all-modules'
          - php_version: '8.3'
            dependencies: 'lowest'
            koharness_modules: 'all-modules'
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          tools: composer:v2

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3
        env:
          COMPOSER_ROOT_VERSION: 3.3.x-dev
        with:
          dependency-versions: ${{ matrix.dependency-versions }}

      - name: Run koharness
        env:
          KOHARNESS_MODULES: ${{ matrix.koharness_modules }}
        run: |
          vendor/bin/koharness

      - name: Run unit tests
        run: |
          set -o errexit
          cd /tmp/koharness
          ./vendor/bin/phpunit --configuration=modules/unittest/phpunit.xml modules/unittest/tests.php
