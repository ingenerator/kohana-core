name: Run tests
on:
  push:
    branches:
      # Only mainline branches, features etc are covered on the pull_request trigger
      - '*.x'
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        php_version:
          - '8.4'
          - '8.5'
          - '8.6'
        dependencies:
          - 'highest'
        kohana_modules:
          - 'Core,Minion'
          - 'Core'
        include:
          - php_version: '8.4'
            dependencies: 'lowest'
            kohana_modules: 'Core,Minion'
          - php_version: '8.5'
            dependencies: 'lowest'
            kohana_modules: 'Core,Minion'
          - php_version: '8.6'
            dependencies: 'lowest'
            kohana_modules: 'Core,Minion'
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          tools: composer:v2

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4
        env:
          COMPOSER_ROOT_VERSION: 3.3.x-dev
        with:
          dependency-versions: ${{ matrix.dependency-versions }}

      - name: Run unit tests
        env:
          KOHANA_MODULES: ${{ matrix.kohana_modules }}
        run: vendor/bin/phpunit --testsuite ${{ matrix.kohana_modules }}
